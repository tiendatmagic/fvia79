server {
    listen 80;
    listen [::]:80;
    server_name fvia79.com www.fvia79.com;

    return 301 https://fvia79.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fvia79.com www.fvia79.com;

    ssl_certificate /etc/letsencrypt/live/fvia79.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fvia79.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fvia79-web;
    index index.html;

    client_max_body_size 1000M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # phpMyAdmin Interface (dung ^~ de ngan regex static location ghi de)
    location ^~ /phpmyadmin {
        alias /var/www/phpmyadmin;
        index index.php index.html index.htm;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    # Laravel Public Storage Assets (Categories, Avatars, Uploads - dung ^~ de ngan regex location ghi de)
    location ^~ /storage {
        root /var/www/fvia79-api/public;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend Laravel API
    location /api {
        alias /var/www/fvia79-api/public;
        try_files $uri $uri/ @api_fallback;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/fvia79-api/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    location @api_fallback {
        rewrite ^/api/(.*)$ /api/index.php?$query_string last;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
