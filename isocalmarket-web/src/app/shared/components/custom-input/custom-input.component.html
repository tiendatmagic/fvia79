<div class="relative w-full flex items-center">
  @if (type === 'textarea') {
    <textarea
      [name]="name"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [rows]="rows"
      (input)="onInput($event)"
      class="form-textarea {{ customClass }}"
    ></textarea>
  } @else if (type === 'password') {
    <input
      [type]="showPasswordToggle ? 'text' : 'password'"
      [name]="name"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="onInput($event)"
      class="form-input form-input-password {{ customClass }}"
    />
    <button
      type="button"
      (click)="togglePassword()"
      class="absolute right-3 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-400 focus:outline-none cursor-pointer bg-transparent border-none p-0 z-10 flex items-center justify-center"
      tabindex="-1"
    >
      @if (showPasswordToggle) {
        <app-icon name="eye-slash" class="w-4 h-4" />
      } @else {
        <app-icon name="eye" class="w-4 h-4" />
      }
    </button>
  } @else {
    <input
      [type]="type"
      [name]="name"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [min]="min"
      [max]="max"
      [step]="step"
      (input)="onInput($event)"
      class="form-input {{ rightIcon ? 'pr-10' : '' }} {{ customClass }}"
    />
    @if (rightIcon) {
      <button
        type="button"
        (click)="onRightIconClick($event)"
        [title]="rightIconTitle || ''"
        [disabled]="disabled || rightIconLoading"
        class="absolute right-2.5 text-slate-400 hover:text-[var(--color-primary)] dark:text-slate-500 dark:hover:text-[var(--color-secondary)] focus:outline-none cursor-pointer bg-transparent border-none p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-all z-10 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
        tabindex="-1"
      >
        @if (rightIconLoading) {
          <app-icon name="loading" class="w-4 h-4 animate-spin text-[var(--color-primary)]" />
        } @else {
          <app-icon [name]="rightIcon" class="w-4 h-4" />
        }
      </button>
    }
  }
</div>
