<div class="relative w-full flex items-center">
  @if (type === 'textarea') {
    <textarea
      [name]="name"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [rows]="rows"
      (input)="onInput($event)"
      class="form-textarea {{ customClass }}"
    ></textarea>
  } @else if (type === 'password') {
    <input
      [type]="showPasswordToggle ? 'text' : 'password'"
      [name]="name"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="onInput($event)"
      class="form-input form-input-password {{ customClass }}"
    />
    <button
      type="button"
      (click)="togglePassword()"
      class="absolute right-3 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-400 focus:outline-none cursor-pointer bg-transparent border-none p-0 z-10 flex items-center justify-center"
      tabindex="-1"
    >
      @if (showPasswordToggle) {
        <app-icon name="eye-slash" class="w-4 h-4" />
      } @else {
        <app-icon name="eye" class="w-4 h-4" />
      }
    </button>
  } @else {
    <input
      [type]="type"
      [name]="name"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [min]="min"
      [max]="max"
      [step]="step"
      (input)="onInput($event)"
      class="form-input {{ customClass }}"
    />
  }
</div>
