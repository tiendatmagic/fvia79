<aside
  class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-slate-950 border-r border-slate-200/50 dark:border-slate-900/50 hidden md:flex flex-col shadow-sm select-none"
>
    <div
    class="flex items-center gap-3.5 px-6 py-6 border-b border-slate-100 dark:border-slate-800/60"
  >
    <app-logo class="w-11 h-11 shrink-0" />
    <div class="flex flex-col select-none">
      <span
        class="text-base font-black tracking-tight leading-none text-slate-800 dark:text-white mb-1.5"
      >
        <span class="text-primary">Isocal</span>
        <span class="text-secondary">market</span>
      </span>
      <span
        class="text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest leading-none"
      >
        Digital Inventory
      </span>
    </div>
  </div>

  <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
    <a
      routerLink="/storefront"
      routerLinkActive="!bg-primary/10 !text-primary !font-extrabold"
      class="flex items-center gap-3.5 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 font-semibold text-sm transition-colors duration-200 cursor-pointer"
    >
      <app-icon name="home" class="w-5 h-5 flex-shrink-0" />
      <span>Cửa hàng</span>
    </a>

    <a
      *ngIf="stateService.isAuthenticated()"
      routerLink="/orders"
      routerLinkActive="!bg-primary/10 !text-primary !font-extrabold"
      class="flex items-center gap-3.5 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 font-semibold text-sm transition-colors duration-200 cursor-pointer"
    >
      <app-icon name="orders" class="w-5 h-5 flex-shrink-0" />
      <span>Lịch sử đơn hàng</span>
    </a>

        <div *ngIf="stateService.isAdmin()" class="pt-4 pb-2">
      <span class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider select-none">
        Quản trị hệ thống
      </span>
    </div>

    <a
      *ngIf="stateService.isAdmin()"
      routerLink="/admin/dashboard"
      routerLinkActive="!bg-primary/10 !text-primary !font-extrabold"
      class="flex items-center gap-3.5 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 font-semibold text-sm transition-colors duration-200 cursor-pointer"
    >
      <app-icon name="dashboard" class="w-5 h-5 flex-shrink-0" />
      <span>Tổng quan Dashboard</span>
    </a>

    <a
      *ngIf="stateService.isAdmin()"
      routerLink="/admin/products"
      routerLinkActive="!bg-primary/10 !text-primary !font-extrabold"
      class="flex items-center gap-3.5 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 font-semibold text-sm transition-colors duration-200 cursor-pointer"
    >
      <app-icon name="list-bullet" class="w-5 h-5 flex-shrink-0" />
      <span>Quản lý sản phẩm</span>
    </a>

    <a
      *ngIf="stateService.isAdmin()"
      routerLink="/admin/inventory"
      routerLinkActive="!bg-primary/10 !text-primary !font-extrabold"
      class="flex items-center gap-3.5 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 font-semibold text-sm transition-colors duration-200 cursor-pointer"
    >
      <app-icon name="inventory" class="w-5 h-5 flex-shrink-0" />
      <span>Quản lý kho hàng</span>
    </a>

    <a
      *ngIf="stateService.isAdmin()"
      routerLink="/admin/orders"
      routerLinkActive="!bg-primary/10 !text-primary !font-extrabold"
      class="flex items-center gap-3.5 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 font-semibold text-sm transition-colors duration-200 cursor-pointer"
    >
      <app-icon name="orders" class="w-5 h-5 flex-shrink-0" />
      <span>Quản lý đơn hàng</span>
    </a>
  </nav>

    <div
    class="px-5 py-4 border-t border-slate-100 dark:border-slate-800/60 bg-slate-50/30 dark:bg-slate-900/10 space-y-4"
  >
        <div class="space-y-2">
      <div
        *ngIf="stateService.isAuthenticated()"
        class="flex items-center justify-between p-3 rounded-xl bg-slate-100/50 dark:bg-slate-900 border border-slate-200/30 dark:border-slate-800/30"
      >
        <div class="flex flex-col">
          <span class="text-xs font-bold text-slate-800 dark:text-white truncate max-w-[120px]">
            {{ stateService.currentUser()?.name }}
          </span>
          <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wide">
            {{ stateService.currentUser()?.role }}
          </span>
        </div>
        <button
          (click)="stateService.authStore.logout().subscribe()"
          class="text-xs font-extrabold text-red-500 hover:text-red-600 hover:scale-105 active:scale-95 transition-all cursor-pointer"
        >
          Thoát
        </button>
      </div>

      <a
        *ngIf="!stateService.isAuthenticated()"
        routerLink="/login"
        class="w-full py-2.5 flex items-center justify-center rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white text-xs font-extrabold active:scale-[0.98] shadow-sm shadow-[var(--color-primary)]/10 transition-all cursor-pointer"
      >
        Đăng nhập
      </a>
    </div>

    <app-theme-switcher />
  </div>
</aside>
