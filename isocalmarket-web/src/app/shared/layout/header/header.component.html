<header
  class="w-full bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-900/50 sticky top-0 z-50 md:z-30 transition-all duration-300 md:pl-72"
>
  <div
    class="max-w-[1530px] mx-auto w-full px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between"
  >
    <!-- LEFT SIDE: MOBILE HAMBURGER & LOGO -->
    <div class="flex items-center gap-3">
      <!-- Hamburger Button - MOBILE ONLY -->
      <button
        (click)="openMobileMenu()"
        class="flex md:hidden w-10 h-10 border border-slate-200/50 dark:border-slate-800/50 rounded-xl items-center justify-center text-slate-500 bg-transparent hover:scale-105 active:scale-95 transition-all cursor-pointer"
        aria-label="Mở menu"
      >
        <app-icon name="hamburger" class="w-5 h-5" />
      </button>

      <!-- Logo & Brand - MOBILE ONLY -->
      <a
        routerLink="/"
        class="flex md:hidden items-center gap-2 select-none cursor-pointer"
      >
        <!-- Icon logo: luôn hiển thị -->
        <app-logo class="w-9 h-9 shrink-0" />
        <!-- Tên thương hiệu: ẩn trên màn hình xs, hiện từ sm trở lên -->
        <span class="hidden sm:block text-sm font-black tracking-tight text-slate-800 dark:text-white">
          Isocalmarket
        </span>
      </a>

      <!-- Page Indicator / Welcome - DESKTOP ONLY -->
      <div class="hidden md:block">
        <span class="text-sm font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
          Enterprise Digital Inventory Management
        </span>
      </div>
    </div>

    <!-- RIGHT SIDE: USER INFO & THEME SWITCHER -->
    <div class="flex items-center gap-3">
      <!-- User Info (Desktop only) -->
      <div class="hidden md:flex items-center gap-3">
        <!-- Chào mừng user -->
        <span *ngIf="stateService.isAuthenticated()" class="text-xs font-semibold text-slate-500">
          Xin chào, <strong class="text-slate-800 dark:text-slate-200">{{ stateService.currentUser()?.name }}</strong>
        </span>

        <!-- Nút đăng nhập/đăng xuất -->
        <button
          app-button
          *ngIf="!stateService.isAuthenticated() && !isAuthPage()"
          [routerLink]="['/auth/login']"
          [variant]="'primary'"
          class="py-2 px-4 text-xs rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white font-extrabold cursor-pointer"
        >
          Đăng nhập
        </button>

        <button
          app-button
          *ngIf="stateService.isAuthenticated()"
          (click)="stateService.authStore.logout().subscribe()"
          [variant]="'cancel'"
          class="py-2 px-4 text-xs rounded-xl border-slate-200/50 text-slate-600 dark:text-slate-400 hover:text-red-500 dark:hover:text-red-400 cursor-pointer"
        >
          Đăng xuất
        </button>
      </div>

      <!-- Mobile Right Side -->
      <div class="flex md:hidden items-center gap-2">
        <!-- Theme Switcher: ẩn trên xs (<sm), hiện từ sm trở lên -->
        <div class="hidden sm:block">
          <app-theme-switcher />
        </div>

        <a
          *ngIf="!stateService.isAuthenticated() && !isAuthPage()"
          routerLink="/auth/login"
          class="text-xs font-extrabold px-3 py-2 rounded-xl text-white cursor-pointer"
          style="background: linear-gradient(to right, var(--color-primary), var(--color-secondary))"
        >
          Đăng nhập
        </a>
      </div>
    </div>
  </div>
</header>
