<div class="space-y-6 pb-2">
  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">Tên sản phẩm <span class="text-red-500">*</span></label>
    <app-custom-input
      [placeholder]="'Ví dụ: Facebook VIA US'"
      [(ngModel)]="name"
      name="name"
      type="text"
      required
    />
  </div>

  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">Slug (Đường dẫn tĩnh)</label>
    <app-custom-input
      [placeholder]="'Tự động tạo từ tên nếu để trống'"
      [(ngModel)]="slug"
      name="slug"
      type="text"
    />
  </div>

  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">Danh mục sản phẩm</label>
    <app-custom-select
      [options]="categoryOptions()"
      valueKey="value"
      labelKey="label"
      [(value)]="categoryId"
    />
  </div>

  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">Đơn giá (VND) <span class="text-red-500">*</span></label>
    <app-custom-input
      [placeholder]="'Nhập đơn giá'"
      [(ngModel)]="price"
      name="price"
      type="number"
      required
    />
  </div>

  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">Mô tả chi tiết</label>
    <app-custom-input
      [placeholder]="'Nhập mô tả sản phẩm...'"
      [(ngModel)]="description"
      name="description"
      type="textarea"
      customClass="min-h-[100px]"
    />
  </div>

  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">Trạng thái <span class="text-red-500">*</span></label>
    <app-custom-select
      [options]="statusOptions"
      valueKey="value"
      labelKey="label"
      [(value)]="status"
    />
  </div>

  <div class="pt-2 space-y-4">
    <div class="flex items-center justify-between">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider">Thuộc tính sản phẩm động (Via/BM/Clone)</label>
      <button
        type="button"
        (click)="addAttribute()"
        class="text-xs font-bold text-[var(--color-primary)] hover:underline flex items-center gap-1 cursor-pointer"
      >
        <span class="text-base font-medium">+</span> Thêm thuộc tính
      </button>
    </div>

    @if (attributes.length === 0) {
      <div class="text-center py-4 bg-slate-50 dark:bg-slate-900/40 rounded-xl border border-dashed border-slate-200/40 dark:border-slate-800/40">
        <p class="text-xs text-slate-400 font-semibold">Chưa có thuộc tính động nào. Thao tác này giúp hiển thị tag lọc như: Quốc gia: US, Cổ 2018...</p>
      </div>
    } @else {
      <div class="space-y-3">
        @for (attr of attributes; track $index) {
          <div class="flex items-center gap-3">
            <div class="flex-1">
              <app-custom-input
                [placeholder]="'Tên thuộc tính (VD: Quốc gia)'"
                [(ngModel)]="attr.label"
                name="attrLabel_{{$index}}"
                type="text"
                required
              />
            </div>
            <div class="flex-1">
              <app-custom-input
                [placeholder]="'Giá trị (VD: US)'"
                [(ngModel)]="attr.value"
                name="attrValue_{{$index}}"
                type="text"
                required
              />
            </div>
            <button
               type="button"
               (click)="removeAttribute($index)"
               class="p-2.5 rounded-xl border border-rose-500/20 bg-rose-50 dark:bg-rose-950/20 text-rose-600 dark:text-rose-500 hover:bg-rose-100 dark:hover:bg-rose-900/40 transition-colors cursor-pointer flex items-center justify-center shrink-0"
               title="Xóa thuộc tính"
             >
               <app-icon name="trash" class="h-4 w-4" />
             </button>
          </div>
        }
      </div>
    }
  </div>

    <div class="pt-4 flex items-center justify-end gap-3 shrink-0">
    <button
      app-button
      (click)="onClose()"
      [variant]="'cancel'"
      class="py-2.5 px-4 rounded-xl text-xs font-bold"
    >
      Hủy bỏ
    </button>
    <button
      app-button
      (click)="onSubmit()"
      [loading]="isSubmitting"
      [variant]="'primary'"
      class="py-2.5 px-4 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white text-xs font-extrabold active:scale-95 shadow-sm shadow-[var(--color-primary)]/10 cursor-pointer"
    >
      Lưu thông tin
    </button>
  </div>
</div>
