<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div app-card class="w-full max-w-md !bg-white/60 dark:!bg-slate-900/60 backdrop-blur-md p-6 sm:p-8 space-y-6">
    
    <!-- Title -->
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">
        Đăng Ký
      </h2>
      <p class="text-sm text-slate-500 font-semibold">
        Tạo tài khoản khách hàng để mua sắm
      </p>
    </div>

    <!-- Inline Error Banner -->
    @if (state.authStore.registerError()) {
      <div class="flex items-start gap-3 p-3.5 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60">
        <svg class="w-4 h-4 text-red-500 shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <p class="text-xs font-bold text-red-600 dark:text-red-400 leading-relaxed">{{ state.authStore.registerError() }}</p>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div class="form-field">
        <label>Họ và Tên</label>
        <app-custom-input
          [placeholder]="'Nhập họ và tên'"
          [(ngModel)]="name"
          name="name"
          type="text"
          required
        />
      </div>

      <div class="form-field">
        <label>Email</label>
        <app-custom-input
          [placeholder]="'Nhập địa chỉ email'"
          [(ngModel)]="email"
          name="email"
          type="email"
          required
        />
      </div>

      <div class="form-field">
        <label>Mật khẩu</label>
        <app-custom-input
          [placeholder]="'Nhập mật khẩu (tối thiểu 6 ký tự)'"
          [(ngModel)]="password"
          name="password"
          type="password"
          required
        />
      </div>

      <div class="form-field">
        <label>Xác nhận mật khẩu</label>
        <app-custom-input
          [placeholder]="'Nhập lại mật khẩu'"
          [(ngModel)]="passwordConfirmation"
          name="passwordConfirmation"
          type="password"
          required
        />
      </div>

      <div class="pt-2">
        <button app-button
          [variant]="'primary'"
          [loading]="state.authStore.authLoading()"
          class="w-full py-3 text-base rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white font-extrabold shadow-md shadow-[var(--color-primary)]/20 active:scale-[0.98] transition-all"
          type="submit"
        >
          Đăng Ký Tài Khoản
        </button>
      </div>
    </form>

    <!-- Footer Links -->
    <div class="text-center text-xs font-semibold text-slate-500">
      Đã có tài khoản? 
      <a routerLink="/login" class="text-[var(--color-primary)] hover:underline ml-1 font-bold">
        Đăng nhập
      </a>
    </div>

  </div>
</div>
