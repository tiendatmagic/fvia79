<div class="space-y-4 pb-2">
  <div
    class="flex items-start gap-3 p-3.5 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700/50"
  >
    <div
      class="shrink-0 w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-800/40 flex items-center justify-center mt-0.5"
    >
      <app-icon name="warning" class="w-4.5 h-4.5 text-amber-600 dark:text-amber-400" />
    </div>
    <div>
      <p class="text-sm font-semibold text-amber-800 dark:text-amber-300 mb-0.5">
        Tuyên bố miễn trừ trách nhiệm
      </p>
      <p class="text-xs text-amber-700 dark:text-amber-400/80 leading-relaxed">
        Website này chỉ được sử dụng cho mục đích quản lý kho hàng và kinh doanh hợp pháp.
      </p>
    </div>
  </div>

  <div class="space-y-2">
    <div
      class="flex items-start gap-2.5 p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700/50"
    >
      <app-icon name="close" class="w-4.5 h-4.5 text-red-500 dark:text-red-400 shrink-0 mt-0.5" strokeWidth="2.5" />
      <p class="text-sm text-red-700 dark:text-red-400 leading-relaxed font-medium">
        Nghiêm cấm tuyệt đối mọi hành vi gian lận, chiếm đoạt tài sản, hoặc sử dụng hệ thống trái
        với quy định pháp luật hiện hành.
      </p>
    </div>
  </div>

  <!-- Divider -->
  <div class="border-t border-slate-100 dark:border-slate-800"></div>

  <!-- Checkbox "Không hỏi lại 7 ngày" -->
  <app-custom-checkbox
    [checked]="suppressFor7Days()"
    (checkedChange)="suppressFor7Days.set($event)"
    label="Không hỏi lại trong 7 ngày"
  />

  <button app-button variant="primary" size="md" class="w-full" (click)="onClose()">Đã hiểu</button>
</div>
