<div class="min-h-screen w-full flex flex-col justify-between bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 relative overflow-hidden transition-colors duration-300">
  <!-- Hiệu ứng phát sáng mờ ảo ở nền -->
  <div class="absolute top-1/4 left-1/4 w-[35rem] h-[35rem] rounded-full bg-primary/5 dark:bg-primary/10 blur-[120px] pointer-events-none -translate-x-1/2 -translate-y-1/2"></div>
  <div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] rounded-full bg-secondary/5 dark:bg-secondary/10 blur-[100px] pointer-events-none translate-x-1/2 translate-y-1/2"></div>

  <!-- Header -->
  <header class="w-full max-w-[1530px] mx-auto px-6 py-6 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <app-logo class="w-9 h-9 shrink-0" />
      <div class="hidden sm:flex flex-col">
        <span class="text-sm font-black tracking-tight leading-none text-slate-800 dark:text-white mb-1">
          <span class="text-primary">Isocal</span><span class="text-secondary">market</span>
        </span>
        <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">
          Digital Inventory
        </span>
      </div>
    </div>
    <div>
      <app-theme-switcher [showLabels]="false" />
    </div>
  </header>

  <!-- Nội dung trung tâm -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-12 z-10 relative">
    <div class="max-w-md w-full text-center space-y-8">
      
      <!-- Minh họa công cụ sửa chữa -->
      <div class="relative flex justify-center mb-4">
        <!-- Vòng tỏa sáng dịu phía sau -->
        <div class="absolute inset-0 w-24 h-24 mx-auto rounded-2xl bg-gradient-to-r from-primary/10 to-secondary/10 blur-xl"></div>
        
        <!-- Khung chứa công cụ -->
        <div class="relative w-24 h-24 flex items-center justify-center bg-white/80 dark:bg-slate-900/80 border border-slate-200/50 dark:border-slate-800/50 rounded-2xl shadow-xl shadow-primary/5">
          <svg class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Screwdriver (Màu phụ trợ - Teal) -->
            <path d="M14.5 9.5l5.5-5.5m-5.5 5.5L7 17H4v3h3l7.5-7.5zm5.5-5.5L22 2l-2-2-2 2 2 2z" stroke="var(--color-secondary)"></path>
            <!-- Wrench (Màu chủ đạo - Blue) -->
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.77 3.77z" stroke="var(--color-primary)"></path>
          </svg>
          
          <!-- Chấm xanh tròn báo trạng thái của Badge -->
          <span class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center shadow-md animate-bounce">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </span>
        </div>
      </div>

      <!-- Tiêu đề & Thông báo -->
      <div class="space-y-4">
        <!-- Số lỗi 503 nổi bật -->
        <h1 class="text-7xl md:text-8xl font-black bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent tracking-tighter filter drop-shadow-[0_2px_10px_rgba(0,109,208,0.15)] select-none">
          503
        </h1>
        
        <div class="space-y-2.5">
          <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-800 dark:text-white">
            Hệ thống đang bảo trì
          </h2>
          <p class="text-slate-500 dark:text-slate-400 text-sm md:text-base leading-relaxed px-4">
            Chúng tôi đang nâng cấp hệ thống để mang đến trải nghiệm tốt hơn cho bạn. Vui lòng quay lại sau ít phút.
          </p>
        </div>
      </div>

      <!-- Trạng thái đang xử lý -->
      <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-slate-100/80 dark:bg-slate-900/80 border border-slate-200/40 dark:border-slate-800/40 text-xs font-bold text-slate-600 dark:text-slate-400">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-secondary"></span>
        </span>
        <span>Đang xử lý...</span>
      </div>

      <!-- Nút thao tác -->
      <div class="pt-4 flex justify-center">
        <button
          (click)="retry()"
          class="flex items-center justify-center gap-2.5 px-8 py-3.5 bg-gradient-to-r from-primary to-secondary hover:opacity-95 text-white font-extrabold rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/30 transition-all duration-200 active:scale-95 cursor-pointer group"
        >
          <svg class="w-4.5 h-4.5 transition-transform duration-500 group-hover:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>Thử lại</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-6 text-center text-xs text-slate-400 dark:text-slate-500 z-10 select-none">
    &copy; 2026 Isocalmarket. All rights reserved.
  </footer>
</div>
