<div class="max-w-[1530px] mx-auto w-full p-4 sm:p-6 space-y-6">
  <app-page-header
    [title]="'admin.membership_tiers_title' | translate"
    [description]="'admin.membership_tiers_desc' | translate"
  >
    <ng-container actions>
      <!-- Toggle Lock/Unlock Button -->
      <button
        type="button"
        (click)="toggleLock()"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl font-extrabold text-sm transition-all duration-200 shadow-sm cursor-pointer"
        [ngClass]="{
          'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20 hover:bg-amber-500/20': isLocked(),
          'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20': !isLocked()
        }"
      >
        <app-icon [name]="isLocked() ? 'lock' : 'lock-open'" class="w-4 h-4" />
        <span>{{ (isLocked() ? 'admin.unlock_to_edit' : 'admin.lock_editing') | translate }}</span>
      </button>

      <button
        (click)="loadTiers()"
        class="px-4 py-2.5 text-sm font-extrabold text-slate-600 dark:text-slate-400 hover:text-primary bg-white dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800/80 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <app-icon name="sync" class="w-4 h-4" />
        {{ 'common.reload' | translate }}
      </button>

      <button
        app-button
        (click)="openCreateModal()"
        variant="primary"
        [disabled]="isLocked()"
        class="flex items-center gap-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white font-extrabold shadow-md shadow-[var(--color-primary)]/15 active:scale-95 transition-all text-sm cursor-pointer"
      >
        <app-icon name="plus" class="w-5 h-5" />
        {{ 'admin.add_membership_tier' | translate }}
      </button>
    </ng-container>
  </app-page-header>

  <!-- Locked Banner Notice -->
  <div
    *ngIf="isLocked()"
    class="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-700 dark:text-amber-400 text-sm flex items-center gap-3"
  >
    <app-icon name="lock" class="w-5 h-5 flex-shrink-0 text-amber-500" />
    <span>{{ 'admin.locked_tier_notice' | translate }}</span>
  </div>

  <div app-card class="overflow-hidden !p-0">
    <app-table
      [columns]="columns()"
      [data]="tiers()"
      [loading]="isLoading()"
      [emptyText]="'admin.no_tiers_found' | translate"
    >
      <ng-template appTableCell="level" let-row="row">
        <span class="font-mono font-extrabold text-slate-900 dark:text-white text-xs">
          #{{ row.level }}
        </span>
      </ng-template>

      <ng-template appTableCell="name" let-row="row">
        <div class="flex items-center gap-2.5">
          <span
            class="px-3 py-1 rounded-full text-xs font-extrabold text-white flex items-center gap-1.5 shadow-sm shrink-0"
            [style.backgroundColor]="row.color || '#3b82f6'"
          >
            <app-icon [name]="row.icon || 'shield'" class="w-3.5 h-3.5" />
            {{ getTierName(row) }}
          </span>
          <span class="text-xs font-semibold text-slate-400 dark:text-slate-500">
            ({{ row.name_en }})
          </span>
        </div>
      </ng-template>

      <ng-template appTableCell="min_deposit" let-row="row">
        <span class="text-xs font-extrabold text-slate-900 dark:text-white">
          {{ row.min_deposit | currency:'USD':'symbol':'1.2-2' }}
        </span>
      </ng-template>

      <ng-template appTableCell="discount_percent" let-row="row">
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-extrabold text-xs">
          -{{ row.discount_percent }}%
        </span>
      </ng-template>

      <ng-template appTableCell="users_count" let-row="row">
        <span class="text-xs font-bold text-slate-700 dark:text-slate-300">
          {{ row.users_count || 0 }} người
        </span>
      </ng-template>

      <ng-template appTableCell="is_active" let-row="row">
        <app-custom-switch
          [checked]="row.is_active ?? true"
          [disabled]="isLocked()"
          (change)="toggleActive(row)"
        />
      </ng-template>

      <ng-template appTableCell="actions" let-row="row">
        <div class="flex items-center justify-end gap-1.5">
          <button
            type="button"
            (click)="openEditModal(row)"
            [disabled]="isLocked()"
            class="p-2 rounded-xl text-slate-500 hover:text-primary hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition-all cursor-pointer"
            title="Chỉnh sửa"
          >
            <app-icon name="edit" class="w-4 h-4" />
          </button>
          <button
            type="button"
            (click)="deleteTier(row)"
            [disabled]="isLocked()"
            class="p-2 rounded-xl text-slate-500 hover:text-rose-500 hover:bg-rose-500/10 disabled:opacity-40 disabled:cursor-not-allowed transition-all cursor-pointer"
            title="Xóa"
          >
            <app-icon name="trash" class="w-4 h-4" />
          </button>
        </div>
      </ng-template>
    </app-table>
  </div>
</div>
