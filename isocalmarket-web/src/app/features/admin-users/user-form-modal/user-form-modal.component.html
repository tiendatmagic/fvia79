<form (ngSubmit)="onSubmit()" class="space-y-4 p-1">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        Tên thành viên <span class="text-rose-500">*</span>
      </label>
      <app-custom-input
        [(ngModel)]="name"
        name="name"
        type="text"
        placeholder="Nhập tên thành viên (VD: Nguyễn Văn A)"
        required
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        Địa chỉ Email <span class="text-rose-500">*</span>
      </label>
      <app-custom-input
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="Nhập địa chỉ email"
        required
      />
    </div>
  </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        Số điện thoại
      </label>
      <app-custom-input
        [(ngModel)]="phone"
        name="phone"
        type="text"
        placeholder="Nhập số điện thoại (nếu có)"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        Mật khẩu {{ isEditMode ? '(Để trống để giữ nguyên)' : '*' }}
      </label>
      <app-custom-input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)"
        [required]="!isEditMode"
      />
    </div>
  </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        Vai trò thành viên
      </label>
      <app-custom-select
        [options]="roleOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="role"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        Số dư tài khoản (VND)
      </label>
      <app-custom-input
        [(ngModel)]="balance"
        name="balance"
        type="number"
        placeholder="Nhập số dư VND"
        [min]="0"
      />
    </div>
  </div>

    <div class="form-field" *ngIf="isEditMode">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
      Trạng thái tài khoản
    </label>
    <app-custom-select
      [options]="statusOptions"
      valueKey="value"
      labelKey="label"
      [(value)]="status"
    />
  </div>

    <div class="pt-2 mt-2" *ngIf="isEditMode">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-2">
      Quản lý B2B API Key
    </label>
    
    <div class="flex items-center gap-3 bg-slate-50 dark:bg-slate-900/60 border border-slate-200/30 dark:border-slate-800/40 rounded-xl p-4">
      <div class="flex-1 min-w-0">
        <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-0.5">Trạng thái khóa hiện tại</span>
        <span class="text-sm font-extrabold font-mono text-slate-800 dark:text-white truncate block">
          {{ api_key || 'Chưa tạo API Key' }}
        </span>
      </div>

      <div class="flex gap-2 shrink-0">
        <button
          type="button"
          (click)="onGenerateKey()"
          class="px-3 py-1.5 text-xs font-extrabold text-[var(--color-primary)] border border-[var(--color-primary)]/20 bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 hover:bg-[var(--color-primary)]/10 rounded-lg transition-all cursor-pointer"
        >
          Sinh Key Mới
        </button>
        <button
          type="button"
          *ngIf="api_key && api_key !== 'Sẽ sinh tự động sau khi lưu...'"
          (click)="onRevokeKey()"
          class="px-3 py-1.5 text-xs font-extrabold text-rose-600 border border-rose-500/20 bg-rose-50 dark:bg-rose-950/20 hover:bg-rose-100 dark:hover:bg-rose-950/40 rounded-lg transition-all cursor-pointer"
        >
          Thu hồi Key
        </button>
      </div>
    </div>
  </div>

    <div class="flex justify-end gap-3 pt-2 mt-6">
    <button
      type="button"
      (click)="onClose()"
      class="px-4.5 py-2.5 rounded-xl border border-slate-200/60 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-900 text-slate-600 dark:text-slate-400 font-extrabold text-sm transition-all cursor-pointer"
    >
      Hủy
    </button>
    <button
      type="submit"
      app-button
      [variant]="'primary'"
      [loading]="isSubmitting"
      class="px-6 py-2.5 rounded-xl font-extrabold text-sm active:scale-[0.98] transition-all cursor-pointer"
    >
      {{ isEditMode ? 'Cập nhật' : 'Tạo mới' }}
    </button>
  </div>
</form>
