<form (ngSubmit)="onSubmit()" class="space-y-6 p-1">
  <!-- Phần 1: Thông tin cá nhân & Đăng nhập -->
  <div class="space-y-3.5">
    <h4
      class="text-xs font-extrabold text-[var(--color-primary)] uppercase tracking-wider flex items-center gap-2"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
      Thông tin cá nhân & Đăng nhập
    </h4>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label
          class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block"
        >
          Tên đăng nhập (Username) <span class="text-rose-500">*</span>
        </label>
        <app-custom-input
          [(ngModel)]="username"
          name="username"
          type="text"
          placeholder="Nhập tên đăng nhập (VD: admin, customer1)"
          [disabled]="isEditMode"
          required
        />
      </div>

      <div class="space-y-1.5">
        <label
          class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block"
        >
          Tên thành viên <span class="text-rose-500">*</span>
        </label>
        <app-custom-input
          [(ngModel)]="name"
          name="name"
          type="text"
          placeholder="Nhập tên thành viên (VD: Nguyễn Văn A)"
          required
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label
          class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block"
        >
          Địa chỉ Email <span class="text-rose-500">*</span>
        </label>
        <app-custom-input
          [(ngModel)]="email"
          name="email"
          type="email"
          placeholder="Nhập địa chỉ email"
          required
        />
      </div>

      <div class="space-y-1.5">
        <label
          class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block"
        >
          Số điện thoại
        </label>
        <app-custom-input
          [(ngModel)]="phone"
          name="phone"
          type="text"
          placeholder="Nhập số điện thoại (VD: 0981xxx)"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label
          class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block"
        >
          Mật khẩu <span *ngIf="!isEditMode" class="text-rose-500">*</span>
        </label>
        <app-custom-input
          [(ngModel)]="password"
          name="password"
          type="password"
          [placeholder]="isEditMode ? 'Nhập mật khẩu mới...' : 'Nhập mật khẩu (tối thiểu 6 ký tự)'"
          [required]="!isEditMode"
        />
        <p
          *ngIf="isEditMode"
          class="text-xs text-slate-400 dark:text-slate-500 italic mt-1"
        >
          * Để trống nếu giữ nguyên mật khẩu
        </p>
      </div>
    </div>
  </div>

  <hr class="border-slate-200/40 dark:border-slate-800/40 my-2" />

  <!-- Phần 2: Phân quyền & Số dư -->
  <div class="space-y-3.5">
    <h4
      class="text-xs font-extrabold text-[var(--color-primary)] uppercase tracking-wider flex items-center gap-2"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      Phân quyền & Số dư tài khoản
    </h4>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label
          class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block"
        >
          Vai trò tài khoản
        </label>
        <app-custom-select
          [options]="roleOptions"
          valueKey="value"
          labelKey="label"
          [(value)]="role"
        />
      </div>

      <div class="space-y-1.5" *ngIf="isEditMode">
        <label
          class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block"
        >
          Trạng thái tài khoản
        </label>
        <app-custom-select
          [options]="statusOptions"
          valueKey="value"
          labelKey="label"
          [(value)]="status"
        />
      </div>
    </div>

    <!-- Khung hiển thị số dư & Nút Điều chỉnh chuyên biệt (Khi sửa) -->
    <div
      *ngIf="isEditMode"
      class="p-4 bg-slate-50 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/40 rounded-2xl flex items-center justify-between gap-4"
    >
      <div class="min-w-0">
        <span
          class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-0.5"
          >Số dư khả dụng hiện tại</span
        >
        <span class="text-lg font-extrabold font-mono text-[var(--color-primary)] block">
          {{ balance | number: '1.0-0' }} ₫
        </span>
      </div>

      <button
        type="button"
        (click)="openAdjustBalance()"
        class="px-4 py-2 text-xs font-extrabold text-teal-700 dark:text-teal-400 border border-teal-500/20 bg-teal-50 dark:bg-teal-950/30 hover:bg-teal-100 dark:hover:bg-teal-950/50 rounded-xl transition-all flex items-center gap-1.5 cursor-pointer shrink-0"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6v6m0 0v6m0-6h6m-6 0H6"
          />
        </svg>
        Cộng / Trừ Số Dư
      </button>
    </div>
  </div>

  <!-- Phần 3: B2B API Key (Khi sửa) -->
  <div class="space-y-3" *ngIf="isEditMode">
    <hr class="border-slate-200/40 dark:border-slate-800/40 my-2" />

    <label
      class="text-xs font-extrabold text-[var(--color-primary)] uppercase tracking-wider flex items-center gap-2"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z"
        />
      </svg>
      Quản lý B2B API Key
    </label>

    <div
      class="flex items-center justify-between gap-4 bg-slate-50 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/40 rounded-2xl p-4"
    >
      <div class="flex-1 min-w-0">
        <span
          class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-0.5"
          >Mã API Key</span
        >
        <span
          class="text-sm font-extrabold font-mono text-slate-800 dark:text-white truncate block"
        >
          {{ api_key || 'Chưa tạo API Key' }}
        </span>
      </div>

      <div class="flex gap-2 shrink-0">
        <button
          type="button"
          (click)="onGenerateKey()"
          class="px-3.5 py-1.5 text-xs font-extrabold text-[var(--color-primary)] border border-[var(--color-primary)]/20 bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 hover:bg-[var(--color-primary)]/15 rounded-xl transition-all cursor-pointer"
        >
          Sinh Key Mới
        </button>
        <button
          type="button"
          *ngIf="api_key && api_key !== 'Sẽ sinh tự động sau khi lưu...'"
          (click)="onRevokeKey()"
          class="px-3.5 py-1.5 text-xs font-extrabold text-rose-600 border border-rose-500/20 bg-rose-50 dark:bg-rose-950/20 hover:bg-rose-100 dark:hover:bg-rose-950/40 rounded-xl transition-all cursor-pointer"
        >
          Thu hồi Key
        </button>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-2 mt-6">
    <button
      type="button"
      (click)="onClose()"
      class="px-5 py-2.5 rounded-xl border border-slate-200/60 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-900 text-slate-600 dark:text-slate-400 font-extrabold text-sm transition-all cursor-pointer"
    >
      Hủy
    </button>
    <button
      type="submit"
      app-button
      [variant]="'primary'"
      [loading]="isSubmitting"
      class="px-6 py-2.5 rounded-xl font-extrabold text-sm active:scale-[0.98] transition-all cursor-pointer"
    >
      {{ isEditMode ? 'Cập nhật' : 'Tạo mới' }}
    </button>
  </div>
</form>
