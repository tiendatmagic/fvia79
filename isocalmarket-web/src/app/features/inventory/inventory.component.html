<div class="max-w-[1530px] mx-auto w-full p-4 sm:p-6 space-y-6">
  <app-page-header
    title="Quản Lý Kho Hàng Số"
    description="Import tài khoản hàng loạt và kiểm soát trạng thái của từng tài nguyên kỹ thuật số."
  >
    <ng-container actions>
      <button
        (click)="fetchFilteredItems(currentPage())"
        class="px-4 py-2.5 text-sm font-extrabold text-slate-600 dark:text-slate-400 hover:text-primary bg-white dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800/80 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <app-icon name="sync" class="w-4 h-4" />
        Tải lại
      </button>
      <button
        app-button
        (click)="openImportDrawer()"
        variant="primary"
        class="flex items-center gap-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white font-extrabold shadow-md shadow-[var(--color-primary)]/15 active:scale-95 transition-all text-sm cursor-pointer"
      >
        <app-icon name="upload" class="w-5 h-5" />
        Import Kho Hàng
      </button>
    </ng-container>
  </app-page-header>

  <div
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 bg-slate-50 dark:bg-slate-900/40 border border-slate-200/30 dark:border-slate-800/30 rounded-2xl p-4 sm:p-5"
  >
    <div class="form-field">
      <label>Bộ lọc Sản phẩm</label>
      <app-custom-select
        [options]="productFilterOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="selectedProductFilter"
        (valueChange)="fetchFilteredItems(1)"
      />
    </div>

    <div class="form-field">
      <label>Bộ lọc Trạng thái</label>
      <app-custom-select
        [options]="statusFilterOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="selectedStatusFilter"
        (valueChange)="fetchFilteredItems(1)"
      />
    </div>

    <div class="form-field">
      <label>Tìm kiếm</label>
      <app-custom-search-input
        [placeholder]="'Tìm kiếm kho hàng...'"
        [(ngModel)]="searchQuery"
        name="searchQuery"
        (valueChange)="onSearch($event)"
        [debounce]="500"
        containerClass="w-full"
      />
    </div>
  </div>

  <div app-card class="overflow-hidden !p-0">
    <app-table
      [columns]="columns"
      [data]="state.inventoryStore.items()"
      [loading]="state.inventoryStore.loading()"
      emptyText="Không tìm thấy tài nguyên nào trong kho."
    >
      <ng-template appTableCell="id" let-row="row">
        <div class="flex items-center gap-1.5">
          <span
            [appTooltip]="row.id"
            class="font-mono font-bold text-[var(--color-primary)] border-b border-dashed border-slate-300 dark:border-slate-700 pb-0.5"
          >
            #{{ row.id | slice: 0 : 8 }}...{{ row.id | slice: -4 }}
          </span>
          <button
            (click)="
              copyToClipboard(row.id, 'Đã sao chép mã tài nguyên!');
              $event.stopPropagation()
            "
            class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition-colors text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer"
            [appTooltip]="'Sao chép ID đầy đủ'"
          >
            <app-icon name="copy" class="w-3.5 h-3.5" />
          </button>
        </div>
      </ng-template>

      <ng-template appTableCell="product_id" let-row="row">
        <span
          class="text-sm font-extrabold text-slate-800 dark:text-white truncate max-w-xs block"
          [appTooltip]="getProductName(row.product_id)"
        >
          {{ getProductName(row.product_id) }}
        </span>
      </ng-template>

      <ng-template appTableCell="batch_name" let-row="row">
        <span
          class="text-sm font-semibold text-slate-700 dark:text-slate-300 truncate max-w-[150px] block"
          [appTooltip]="row.batch_name"
        >
          {{ row.batch_name }}
        </span>
      </ng-template>

      <ng-template appTableCell="available_count" let-row="row">
        <app-badge
          [variant]="
            row.available_count === 0
              ? 'danger'
              : row.available_count === row.initial_count
                ? 'success'
                : 'warning'
          "
          size="md"
          rounded="md"
          [appTooltip]="
            'Khả dụng: ' + row.available_count + ' / Ban đầu: ' + row.initial_count
          "
        >
          {{ row.available_count }} / {{ row.initial_count }}
        </app-badge>
      </ng-template>

      <ng-template appTableCell="status" let-row="row">
        <app-badge
          [variant]="
            row.status === 'active'
              ? 'success'
              : row.status === 'completed'
                ? 'primary'
                : 'warning'
          "
          size="sm"
          rounded="md"
          [appTooltip]="
            row.status === 'active'
              ? 'Hoạt động'
              : row.status === 'completed'
                ? 'Hoàn thành'
                : 'Tạm khóa'
          "
        >
          {{
            row.status === 'active'
              ? 'Hoạt động'
              : row.status === 'completed'
                ? 'Hoàn thành'
                : 'Tạm khóa'
          }}
        </app-badge>
      </ng-template>

      <ng-template appTableCell="actions" let-row="row">
        <div class="flex items-center justify-end gap-2 whitespace-nowrap">
          <button
            (click)="openEditModal(row)"
            [disabled]="loadingItemId() !== null"
            [class.opacity-50]="loadingItemId() !== null"
            [class.pointer-events-none]="loadingItemId() !== null"
            class="text-xs font-bold px-3 py-1.5 rounded-lg border border-[var(--color-primary)]/20 hover:bg-[var(--color-primary)]/10 text-[var(--color-primary)] bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 dark:border-[var(--color-primary)]/30 dark:hover:bg-[var(--color-primary)]/20 hover:scale-105 active:scale-95 transition-all cursor-pointer flex items-center gap-1 shrink-0"
            [appTooltip]="'Chỉnh sửa'"
          >
            @if (loadingItemId() === row.id) {
              <div
                class="w-3.5 h-3.5 rounded-full border border-current border-t-transparent animate-spin shrink-0"
              ></div>
            } @else {
              <app-icon name="edit" class="w-3.5 h-3.5" />
            }
            <span>Sửa</span>
          </button>
          <button
            (click)="confirmDeleteItem(row)"
            class="text-xs font-bold px-3 py-1.5 rounded-lg border border-rose-500/20 dark:border-rose-500/30 hover:bg-rose-100 dark:hover:bg-rose-950/40 text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/20 hover:scale-105 active:scale-95 transition-all cursor-pointer flex items-center gap-1 shrink-0"
            [appTooltip]="'Xóa'"
          >
            <app-icon name="trash" class="w-3.5 h-3.5" />
            <span>Xóa</span>
          </button>
        </div>
      </ng-template>
    </app-table>

    <app-pagination
      [currentPage]="state.inventoryStore.currentPage()"
      [totalPages]="state.inventoryStore.lastPage()"
      [totalItems]="state.inventoryStore.totalItems()"
      [itemsPerPage]="limit"
      [itemName]="'tài nguyên'"
      (pageChange)="fetchPage($event)"
    />
  </div>
</div>
