<div class="max-w-[1530px] mx-auto w-full p-4 sm:p-6 space-y-6">
  <!-- Header -->
  <app-page-header title="Quản Lý Kho Hàng Số" description="Import tài khoản hàng loạt và kiểm soát trạng thái của từng tài nguyên kỹ thuật số.">
    <ng-container actions>
      <button
        app-button
        (click)="openImportDrawer()"
        variant="primary"
        class="flex items-center gap-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white font-extrabold shadow-md shadow-[var(--color-primary)]/15 active:scale-95 transition-all text-sm cursor-pointer"
      >
        <app-icon name="upload" class="w-5 h-5" />
        Import Kho Hàng
      </button>
    </ng-container>
  </app-page-header>

  <!-- Filters Section -->
  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 bg-slate-50 dark:bg-slate-900/40 border border-slate-200/30 dark:border-slate-800/30 rounded-2xl p-4 sm:p-5"
  >
    <div class="form-field">
      <label>Bộ lọc Sản phẩm</label>
      <app-custom-select
        [options]="productFilterOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="selectedProductFilter"
        (valueChange)="fetchFilteredItems(1)"
      />
    </div>

    <div class="form-field">
      <label>Bộ lọc Trạng thái</label>
      <app-custom-select
        [options]="statusFilterOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="selectedStatusFilter"
        (valueChange)="fetchFilteredItems(1)"
      />
    </div>
  </div>

  <!-- Main table card -->
  <div app-card class="overflow-hidden !p-0">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="border-b border-slate-200/30 dark:border-slate-800/30 bg-slate-50/50 dark:bg-slate-950/20"
          >
            <th
              class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap"
            >
              ID
            </th>
            <th
              class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap"
            >
              Tên sản phẩm
            </th>
            <th
              class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap"
            >
              Dữ liệu tài nguyên
            </th>
            <th
              class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider text-center whitespace-nowrap"
            >
              Trạng thái
            </th>
            <th
              class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider text-center whitespace-nowrap"
            >
              Lịch sử đơn hàng
            </th>
            <th
              class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider text-right whitespace-nowrap"
            >
              Thao tác
            </th>
          </tr>
        </thead>
        <tbody>
          <!-- Skeleton Loading -->
          <tr *ngIf="state.inventoryStore.loading()">
            <td colspan="6" class="p-6">
              <app-skeleton-loader [type]="'table'" [rows]="5" [showHeader]="false" />
            </td>
          </tr>

          <!-- Empty State -->
          <tr *ngIf="!state.inventoryStore.loading() && state.inventoryStore.items().length === 0">
            <td colspan="6" class="py-12 text-center text-sm font-semibold text-slate-400">
              Không tìm thấy tài nguyên nào trong kho.
            </td>
          </tr>

          <!-- Data rows -->
          @if (!state.inventoryStore.loading()) {
            <tr
              *ngFor="let item of state.inventoryStore.items()"
              class="border-b border-slate-200/30 dark:border-slate-800/30 hover:bg-slate-50/30 dark:hover:bg-slate-950/10 transition-colors"
            >
              <td
                class="py-4 px-6 text-xs font-mono font-bold text-[var(--color-primary)] whitespace-nowrap"
              >
                #{{ item.id }}
              </td>
              <td class="py-4 px-6 whitespace-nowrap">
                <span class="text-sm font-extrabold text-slate-800 dark:text-white">
                  {{ getProductName(item.product_id) }}
                </span>
              </td>
              <td class="py-4 px-6 min-w-[200px]">
                <div class="flex items-center gap-2 max-w-xs md:max-w-md">
                  <code
                    class="text-xs font-mono bg-slate-50 dark:bg-slate-950 px-2 py-1 rounded border border-slate-200/40 dark:border-slate-800/40 text-slate-700 dark:text-slate-300 truncate"
                    title="{{ item.data }}"
                  >
                    {{ item.data }}
                  </code>
                </div>
              </td>
              <td class="py-4 px-6 text-center whitespace-nowrap">
                <app-badge
                  [variant]="item.status === 'available' ? 'success' : item.status === 'reserved' ? 'warning' : 'neutral'"
                  size="sm"
                  rounded="md"
                >
                  {{ item.status }}
                </app-badge>
              </td>
              <td class="py-4 px-6 text-center whitespace-nowrap">
                <span
                  *ngIf="item.order_id"
                  class="text-xs font-mono font-bold text-slate-500 bg-slate-50 dark:bg-slate-950 px-2 py-1 rounded border"
                >
                  #{{ item.order_id }}
                </span>
                <span *ngIf="!item.order_id" class="text-xs text-slate-400 font-semibold">-</span>
              </td>
              <td class="py-4 px-6 text-right whitespace-nowrap">
                <div class="flex items-center justify-end gap-2 whitespace-nowrap">
                  <button
                    (click)="confirmDeleteItem(item)"
                    [disabled]="item.status === 'sold'"
                    class="text-xs font-bold px-3 py-1.5 rounded-lg border border-rose-500/20 dark:border-rose-500/30 hover:bg-rose-100 dark:hover:bg-rose-950/40 text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/20 hover:scale-105 active:scale-95 transition-all cursor-pointer disabled:opacity-50 disabled:pointer-events-none"
                  >
                    Xóa
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
      <!-- Pagination -->
      <div
        class="p-4 border-t border-slate-200/30 dark:border-slate-800/30 flex justify-center bg-slate-50/20 dark:bg-slate-950/10"
        *ngIf="state.inventoryStore.lastPage() > 1"
      >
        <app-pagination
          [currentPage]="state.inventoryStore.currentPage()"
          [totalPages]="state.inventoryStore.lastPage()"
          [totalItems]="state.inventoryStore.totalItems()"
          [itemsPerPage]="limit"
          [itemName]="'tài nguyên'"
          (pageChange)="fetchPage($event)"
        />
      </div>
    </div>
  </div>
</div>
