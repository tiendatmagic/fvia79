<div class="space-y-6 pb-2">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2"
        >Sản phẩm <span class="text-red-500">*</span></label
      >
      <app-custom-select
        [options]="productOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="editProductId"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2"
        >Trạng thái <span class="text-red-500">*</span></label
      >
      <app-custom-select
        [options]="statusOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="status"
      />
    </div>
  </div>

  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2"
      >Tên Lô Hàng <span class="text-red-500">*</span></label
    >
    <app-custom-input
      [placeholder]="'Nhập tên lô hàng...'"
      [(ngModel)]="batchName"
      name="batchName"
      type="text"
    />
  </div>

  <div class="form-field">
    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2"
      >Danh sách tài nguyên còn lại (mỗi dòng một key)</label
    >
    <app-custom-input
      [placeholder]="'Nhập thông tin tài nguyên kỹ thuật số...'"
      [(ngModel)]="keysPool"
      name="keysPool"
      type="textarea"
      [rows]="8"
      customClass="font-mono min-h-[200px]"
    />
    <div class="flex justify-between items-center text-xs font-bold text-slate-400 mt-1">
      <span>Định dạng: mỗi dòng một tài khoản</span>
      <span class="text-[var(--color-primary)]">Tổng cộng: {{ keysCount }} tài khoản</span>
    </div>
  </div>

  <div class="pt-4 flex items-center justify-end gap-3 shrink-0">
    <button
      app-button
      (click)="onClose()"
      [variant]="'cancel'"
      class="py-2.5 px-4 rounded-xl text-xs font-bold"
    >
      Hủy bỏ
    </button>
    <button
      app-button
      (click)="onSubmit()"
      [loading]="isSubmitting()"
      [variant]="'primary'"
      class="py-2.5 px-4 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white text-xs font-extrabold active:scale-95 shadow-sm shadow-[var(--color-primary)]/10 cursor-pointer"
    >
      Lưu thay đổi
    </button>
  </div>
</div>
