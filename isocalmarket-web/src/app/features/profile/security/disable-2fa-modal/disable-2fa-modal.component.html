<div class="space-y-5">
  <div class="text-center space-y-2">
    <p class="text-xs text-slate-500 font-semibold max-w-xs mx-auto">
  {{ 'security.disable_instruction' | translate }}
    </p>
  </div>

    <div class="form-field space-y-1.5">
  <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">{{ 'security.otp_label' | translate }} <span class="text-red-500">*</span></label>
    <app-custom-input
      [(ngModel)]="code"
      name="code"
      type="text"
    [placeholder]="'auth.otp_placeholder' | translate"
    />
  </div>

    <div class="flex gap-3 pt-2">
    <button
      app-button
      [variant]="'secondary'"
      (click)="onClose()"
      class="flex-1 py-2.5 rounded-xl font-bold"
    >
    {{ 'action.cancel' | translate }}
    </button>
    <button
      app-button
      [variant]="'primary'"
      [loading]="isSubmitting()"
      (click)="onConfirm()"
      class="flex-[2] py-2.5 rounded-xl font-bold bg-rose-600 text-white shadow-md shadow-rose-600/10"
    >
    {{ 'security.disable_confirm' | translate }}
    </button>
  </div>
</div>
