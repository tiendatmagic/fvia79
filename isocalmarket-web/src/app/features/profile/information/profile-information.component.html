<div class="space-y-6">
  <div class="pb-1">
    <h3 class="text-lg font-black text-slate-800 dark:text-slate-200">{{ 'profile.personal_info' | translate }}</h3>
    <p class="text-xs text-slate-400 dark:text-slate-500 font-bold mt-0.5">
      {{ 'profile.update_contact' | translate }}
    </p>
  </div>

  <hr class="border-slate-200/40 dark:border-slate-800/40" />

  <form (ngSubmit)="onSave()" class="space-y-5">
    <div class="form-field" *ngIf="uid">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
        >{{ 'usr.user_uid' | translate }}</label
      >
      <app-custom-input [(ngModel)]="uid" name="uid" [disabled]="true" />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
        >{{ 'usr.username' | translate }}</label
      >
      <app-custom-input [(ngModel)]="username" name="username" [disabled]="true" />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
        >{{ 'usr.name' | translate }} <span class="text-red-500">*</span></label
      >
      <app-custom-input [(ngModel)]="name" name="name" [placeholder]="'profile.name_placeholder' | translate" />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
        >{{ 'usr.email' | translate }}</label
      >
      <app-custom-input [(ngModel)]="email" name="email" [disabled]="true" />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5"
        >{{ 'usr.phone' | translate }}</label
      >
      <app-custom-input
        [(ngModel)]="phone"
        name="phone"
        [placeholder]="'profile.phone_placeholder' | translate"
      />
    </div>

    <div class="pt-4 flex justify-end">
      <button
        app-button
        [variant]="'primary'"
        [loading]="isSubmitting()"
        type="submit"
        class="px-6 py-2.5 rounded-xl font-bold bg-[var(--color-primary)] text-white shadow-md shadow-[var(--color-primary)]/10"
      >
        {{ 'action.save' | translate }}
      </button>
    </div>
  </form>
</div>
