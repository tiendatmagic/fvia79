<div class="space-y-6">
    <div class="border-b border-slate-100 dark:border-slate-800/60 pb-3">
    <h3 class="text-lg font-black text-slate-800 dark:text-slate-200">Thay đổi mật khẩu</h3>
    <p class="text-xs text-slate-400 dark:text-slate-500 font-bold mt-0.5">Bảo vệ tài khoản bằng mật khẩu có độ bảo mật cao.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="form-field">
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Mật khẩu hiện tại</label>
      <app-custom-input
        [(ngModel)]="currentPassword"
        name="currentPassword"
        type="password"
        [placeholder]="'Nhập mật khẩu hiện tại của bạn'"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Mật khẩu mới</label>
      <app-custom-input
        [(ngModel)]="newPassword"
        name="newPassword"
        type="password"
        [placeholder]="'Tối thiểu 6 ký tự'"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">Xác nhận mật khẩu mới</label>
      <app-custom-input
        [(ngModel)]="newPasswordConfirmation"
        name="newPasswordConfirmation"
        type="password"
        [placeholder]="'Nhập lại mật khẩu mới để xác nhận'"
      />
    </div>

    <div class="pt-4 flex justify-end">
      <button
        app-button
        [variant]="'primary'"
        [loading]="isSubmitting"
        type="submit"
        class="px-6 py-2.5 rounded-xl font-bold bg-[var(--color-primary)] text-white shadow-md shadow-[var(--color-primary)]/10"
      >
        Cập nhật mật khẩu
      </button>
    </div>
  </form>
</div>
