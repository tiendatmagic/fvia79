<div class="max-w-[1530px] mx-auto w-full p-4 sm:p-6 space-y-6">
    <app-page-header
    [title]="'profile.title' | translate"
    [description]="'profile.description' | translate"
  />

  <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        <div
      app-card
      class="col-span-12 lg:col-span-4 xl:col-span-3 p-5 sm:p-6"
    >
            <div
        class="flex overflow-x-auto gap-1.5 md:flex-col pb-2 md:pb-0 border-b border-slate-100 dark:border-slate-800/60 md:border-b-0 whitespace-nowrap scrollbar-none"
      >
                <a
          routerLink="information"
          routerLinkActive="bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 border-l-4 border-[var(--color-primary)] text-[var(--color-primary)] font-extrabold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/10 border-l-4 border-transparent rounded-xl transition-all cursor-pointer whitespace-nowrap"
        >
          <app-icon name="user" class="w-[18px] h-[18px] shrink-0" />
          <span class="whitespace-nowrap">{{ 'profile.basic_info' | translate }}</span>
        </a>

                <a
          routerLink="password"
          routerLinkActive="bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 border-l-4 border-[var(--color-primary)] text-[var(--color-primary)] font-extrabold"
          class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/10 border-l-4 border-transparent rounded-xl transition-all cursor-pointer whitespace-nowrap"
        >
          <app-icon name="key" class="w-[18px] h-[18px] shrink-0" />
          <span class="whitespace-nowrap">{{ 'profile.change_password' | translate }}</span>
        </a>

                <a
          routerLink="security"
          routerLinkActive="bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 border-l-4 border-[var(--color-primary)] text-[var(--color-primary)] font-extrabold"
          class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/10 border-l-4 border-transparent rounded-xl transition-all cursor-pointer whitespace-nowrap"
        >
          <app-icon name="shield-check" class="w-[18px] h-[18px] shrink-0" />
          <span class="whitespace-nowrap">{{ 'profile.security_2fa' | translate }}</span>
        </a>

        <a
          routerLink="devices"
          routerLinkActive="bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 border-l-4 border-[var(--color-primary)] text-[var(--color-primary)] font-extrabold"
          class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/10 border-l-4 border-transparent rounded-xl transition-all cursor-pointer whitespace-nowrap"
        >
          <app-icon name="devices" class="w-[18px] h-[18px] shrink-0" />
          <span class="whitespace-nowrap">{{ 'profile.devices' | translate }}</span>
        </a>
      </div>
    </div>

        <div
      app-card
      class="col-span-12 lg:col-span-8 xl:col-span-9 p-5 sm:p-6"
    >
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
