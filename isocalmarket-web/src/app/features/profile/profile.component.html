<div class="max-w-[1200px] mx-auto px-4 py-8 space-y-6">
  <!-- Page Header -->
  <div class="space-y-1">
    <h1 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">
      Tài Khoản Cá Nhân
    </h1>
    <p class="text-sm text-slate-500 font-semibold">
      Quản lý thông tin cá nhân, cập nhật mật khẩu và thiết lập bảo mật hai lớp.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <!-- Sidebar / Navigation Tabs -->
    <div class="md:col-span-1 space-y-4">
      
      <!-- User Quick Info Card (Desktop Only) -->
      <div class="hidden md:flex items-center gap-3.5 p-4 bg-white/40 dark:bg-slate-900/40 backdrop-blur-md border border-slate-200/40 dark:border-slate-800/40 rounded-2xl shadow-sm">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] flex items-center justify-center text-white text-lg font-black shadow-md">
          {{ getUserInitial() }}
        </div>
        <div class="min-w-0">
          <h4 class="font-black text-slate-800 dark:text-slate-100 text-sm truncate">
            {{ state.currentUser()?.name }}
          </h4>
          <p class="text-xs text-slate-400 dark:text-slate-500 font-bold truncate mt-0.5">
            {{ state.currentUser()?.email }}
          </p>
        </div>
      </div>

      <!-- Menu links container -->
      <div class="flex overflow-x-auto gap-1.5 md:flex-col pb-2 md:pb-0 border-b border-slate-100 dark:border-slate-800/60 md:border-b-0 whitespace-nowrap scrollbar-none">
        
        <!-- Tab 1: Information -->
        <a
          routerLink="information"
          routerLinkActive="bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 border-l-4 border-[var(--color-primary)] text-[var(--color-primary)] font-extrabold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/10 border-l-4 border-transparent rounded-r-xl transition-all cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[18px] h-[18px]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          <span>Thông tin cơ bản</span>
        </a>

        <!-- Tab 2: Password -->
        <a
          routerLink="password"
          routerLinkActive="bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 border-l-4 border-[var(--color-primary)] text-[var(--color-primary)] font-extrabold"
          class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/10 border-l-4 border-transparent rounded-r-xl transition-all cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[18px] h-[18px]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
          </svg>
          <span>Đổi mật khẩu</span>
        </a>

        <!-- Tab 3: Security 2FA -->
        <a
          routerLink="security"
          routerLinkActive="bg-[var(--color-primary)]/5 dark:bg-[var(--color-primary)]/10 border-l-4 border-[var(--color-primary)] text-[var(--color-primary)] font-extrabold"
          class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/10 border-l-4 border-transparent rounded-r-xl transition-all cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-[18px] h-[18px]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
          </svg>
          <span>Bảo mật 2FA</span>
        </a>

      </div>
    </div>

    <!-- Main Content Container -->
    <div class="md:col-span-3 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md border border-slate-200/50 dark:border-slate-800/50 rounded-2xl p-6 sm:p-8 shadow-sm">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
