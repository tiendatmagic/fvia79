<div class="max-w-[1530px] mx-auto w-full px-4 sm:px-6 space-y-6 py-6">
  <app-page-header
    title="Cấu hình hệ thống"
    subtitle="Quản lý địa chỉ ví nhận USDT nạp tiền và các khóa tích hợp với blockchain scanner"
  />

  @if (loading()) {
    <app-card>
      <app-skeleton-loader type="form" [showHeader]="false" />
    </app-card>
  } @else {
    <app-card>
      <form (ngSubmit)="onSubmit()" #settingsForm="ngForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          
          <div class="form-field md:col-span-2">
            <label>Địa chỉ ví nhận USDT của Admin (BEP20)</label>
            <div class="relative mt-1">
              <input
                type="text"
                name="admin_wallet_address"
                class="form-input w-full pr-10"
                placeholder="Nhập địa chỉ ví USDT (ví dụ: 0xAB4a22a64bBC...)"
                [(ngModel)]="form.admin_wallet_address"
                required
              />
            </div>
            <p class="mt-1.5 text-xs text-slate-400 dark:text-slate-500">
              Đây là địa chỉ ví BEP20 trên Binance Smart Chain sẽ nhận tiền nạp từ khách hàng. Hãy chắc chắn địa chỉ này là chính xác để tránh mất mát tài sản.
            </p>
          </div>

          <div class="form-field md:col-span-2">
            <label>BSCScan API Key</label>
            <div class="relative mt-1">
              <input
                type="password"
                name="scanner_api_key"
                class="form-input w-full pr-10"
                placeholder="Nhập API Key BSCScan..."
                [(ngModel)]="form.scanner_api_key"
                required
              />
            </div>
            <p class="mt-1.5 text-xs text-slate-400 dark:text-slate-500">
              Khóa API dùng để kết nối và tự động kiểm tra giao dịch nạp tiền trên chuỗi khối BSC thông qua BSCScan Scanner.
            </p>
          </div>

        </div>

        <div class="flex justify-end pt-4 border-t border-slate-200/40 dark:border-slate-800/40">
          <button
            app-button
            type="submit"
            [loading]="submitting()"
            [disabled]="!settingsForm.form.valid || submitting()"
            class="px-6 py-2.5 rounded-xl font-bold bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white hover:scale-[1.01] active:scale-[0.98] transition-all duration-300 shadow-md shadow-[var(--color-primary)]/20"
          >
            Lưu cấu hình
          </button>
        </div>
      </form>
    </app-card>
  }
</div>
