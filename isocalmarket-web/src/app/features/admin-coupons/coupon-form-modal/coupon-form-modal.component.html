<div class="space-y-5 pb-2">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-field">
      <label
        class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1"
        >{{ 'coupon.code' | translate }} <span class="text-rose-500">*</span></label
      >
      <app-custom-input
        [(ngModel)]="code"
        name="code"
        type="text"
        [disabled]="isEditMode"
        [rightIcon]="!isEditMode ? 'dice' : ''"
        [rightIconTitle]="'admin.coupon_generate_random' | translate"
        (rightIconClick)="onGenerateCode()"
        customClass="uppercase tracking-wider font-extrabold text-sm"
        required
      />
    </div>

    <div class="form-field">
      <label
        class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1"
        >{{ 'coupon.type' | translate }} <span class="text-rose-500">*</span></label
      >
      <app-custom-select [options]="typeOptions" [(ngModel)]="type" name="type" />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-field">
      <label
        class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1"
        >{{ 'coupon.value' | translate }} <span class="text-rose-500">*</span></label
      >
      <app-custom-input [(ngModel)]="value" name="value" type="number" required />
    </div>

    <div class="form-field">
      <label
        class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1"
        >{{ 'coupon.min_order' | translate }} <span class="text-rose-500">*</span></label
      >
      <app-custom-input [(ngModel)]="minSpend" name="minSpend" type="number" required />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-field">
      <label
        class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1"
        >{{ 'coupon.start_date' | translate }} <span class="text-rose-500">*</span></label
      >
      <app-custom-date-picker
        [(ngModel)]="startDate"
        name="startDate"
        [enableTime]="true"
        [placeholder]="'common.select_date' | translate"
      />
    </div>

    <div class="form-field">
      <label
        class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1"
        >{{ 'coupon.end_date' | translate }} <span class="text-rose-500">*</span></label
      >
      <app-custom-date-picker
        [(ngModel)]="endDate"
        name="endDate"
        [enableTime]="true"
        [placeholder]="'common.select_date' | translate"
      />
    </div>
  </div>

  <div class="form-field">
    <label
      class="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-2"
        >{{ 'coupon.usage_limit' | translate }} <span class="text-rose-500">*</span></label
    >
    <app-custom-input [(ngModel)]="usageLimit" name="usageLimit" type="number" required />
    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold mt-1">
        {{ 'coupon.unlimited_hint' | translate }}
    </p>
  </div>

  <div
    class="pt-4 flex items-center justify-end gap-3 shrink-0 border-t border-slate-100 dark:border-slate-800"
  >
    <button
      app-button
      (click)="onClose()"
      [variant]="'cancel'"
      class="py-2.5 px-4 rounded-xl text-xs font-bold"
    >
      {{ 'action.cancel' | translate }}
    </button>
    <button
      app-button
      (click)="onSubmit()"
      [loading]="isSubmitting()"
      [variant]="'primary'"
      class="py-2.5 px-4 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white text-xs font-extrabold active:scale-95 shadow-sm shadow-[var(--color-primary)]/10 cursor-pointer"
    >
      {{ 'coupon.save' | translate }}
    </button>
  </div>
</div>
