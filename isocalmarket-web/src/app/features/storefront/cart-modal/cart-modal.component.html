<div class="space-y-6 pb-2">
  <!-- Giỏ hàng rỗng -->
  <div *ngIf="cart.items().length === 0" class="text-center py-12 space-y-4">
    <div class="w-16 h-16 bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
      </svg>
    </div>
    <div class="space-y-1">
      <p class="text-sm font-bold text-slate-800 dark:text-slate-200">Giỏ hàng của bạn đang trống</p>
      <p class="text-xs text-slate-400">Vui lòng chọn thêm sản phẩm ở cửa hàng để tiếp tục thanh toán.</p>
    </div>
    <button app-button (click)="onClose()" [variant]="'cancel'" class="py-2.5 px-5 rounded-xl text-xs font-bold">
      Tiếp tục mua hàng
    </button>
  </div>

  <!-- Danh sách Item trong giỏ -->
  <div *ngIf="cart.items().length > 0" class="space-y-6">
    <div class="space-y-3 max-h-[350px] overflow-y-auto pr-1 no-scrollbar">
      <div
        *ngFor="let item of cart.items()"
        class="bg-slate-50/50 dark:bg-slate-900/10 border border-slate-100 dark:border-slate-800/60 p-4 rounded-xl flex items-center justify-between gap-4"
      >
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">{{ item.name }}</p>
          <p class="text-xs font-bold text-[#006dd0] mt-1">{{ item.price | number }} VND / cái</p>
        </div>

        <div class="flex items-center gap-4 shrink-0">
          <!-- Điều chỉnh số lượng -->
          <div class="flex items-center gap-2 border border-slate-200/50 dark:border-slate-800/80 rounded-lg p-1 bg-white dark:bg-slate-950">
            <button
              (click)="cart.updateQuantity(item.id, item.quantity - 1)"
              class="w-6 h-6 rounded-md hover:bg-slate-100 dark:hover:bg-slate-900 flex items-center justify-center text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 transition-all font-black text-sm active:scale-90"
            >
              -
            </button>
            <span class="w-8 text-center text-xs font-extrabold text-slate-700 dark:text-slate-300">
              {{ item.quantity }}
            </span>
            <button
              (click)="cart.updateQuantity(item.id, item.quantity + 1)"
              class="w-6 h-6 rounded-md hover:bg-slate-100 dark:hover:bg-slate-900 flex items-center justify-center text-slate-500 hover:text-slate-700 dark:hover:text-slate-200 transition-all font-black text-sm active:scale-90"
            >
              +
            </button>
          </div>

          <!-- Nút xóa -->
          <button
            (click)="cart.removeFromCart(item.id)"
            class="text-red-400 hover:text-red-500 hover:scale-105 active:scale-95 transition-all p-1"
            title="Xóa sản phẩm"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4.5 h-4.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Tóm tắt thanh toán -->
    <div class="bg-slate-50/50 dark:bg-slate-900/10 border border-slate-100 dark:border-slate-800/60 p-4 rounded-xl space-y-2.5">
      <div class="flex justify-between text-xs font-bold text-slate-400">
        <span>Tổng số lượng:</span>
        <span class="text-slate-700 dark:text-slate-300 font-extrabold">{{ cart.totalItems() }} sản phẩm</span>
      </div>
      <div class="flex justify-between text-sm font-black border-t border-slate-100 dark:border-slate-800/60 pt-2.5">
        <span class="text-slate-700 dark:text-slate-300">Tổng tiền thanh toán:</span>
        <span class="text-[#006dd0] font-black">{{ cart.totalAmount() | number }} VND</span>
      </div>
    </div>

    <!-- Footer buttons -->
    <div class="pt-6 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-end gap-3 shrink-0">
      <button
        app-button
        (click)="onClose()"
        [variant]="'cancel'"
        class="py-2.5 px-4 rounded-xl text-xs font-bold"
      >
        Tiếp tục xem
      </button>
      <button
        app-button
        (click)="checkout()"
        [variant]="'primary'"
        [disabled]="isSubmitting"
        class="py-2.5 px-5 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white text-xs font-extrabold active:scale-95 shadow-sm shadow-[var(--color-primary)]/10 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isSubmitting ? 'Đang tạo đơn hàng...' : 'Đặt hàng ngay' }}
      </button>
    </div>
  </div>
</div>
