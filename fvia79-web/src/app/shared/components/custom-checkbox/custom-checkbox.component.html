<label
  class="group inline-flex items-center gap-2.5 cursor-pointer select-none"
  [class.items-start]="description"
  [class.items-center]="!description"
  [class.opacity-50]="disabled"
  [class.pointer-events-none]="disabled"
>
  <div
    class="custom-checkbox-box relative shrink-0 h-5 w-5 rounded-[6px] border-[1.8px] transition-colors duration-200 flex items-center justify-center"
    [class.mt-0.5]="description"
    [ngClass]="
      checked()
        ? 'border-primary bg-primary text-white'
        : 'bg-white dark:bg-[#161e25] border-slate-400 dark:border-slate-500/90'
    "
  >
    <app-icon
      name="check"
      strokeWidth="3.5"
      class="w-3.5 h-3.5 text-white transition-[transform,opacity] duration-150 ease-out"
      [class.scale-0]="!checked()"
      [class.scale-100]="checked()"
      [class.opacity-0]="!checked()"
      [class.opacity-100]="checked()"
    />
  </div>

  <input
    type="checkbox"
    [checked]="checked()"
    (change)="toggleChecked()"
    [disabled]="disabled"
    class="sr-only"
  />

  @if (label || description) {
    <div class="text-xs sm:text-sm">
      @if (label) {
        <p class="font-semibold text-slate-700 dark:text-slate-300 leading-snug">
          {{ label }}
        </p>
      }
      @if (description) {
        <p class="text-xs text-slate-400 mt-0.5 leading-normal">{{ description }}</p>
      }
    </div>
  } @else {
    <span
      class="text-sm font-semibold text-slate-700 dark:text-slate-300 leading-snug empty:hidden"
    >
      <ng-content></ng-content>
    </span>
  }
</label>
