<div
  #containerEl
  [class]="
    'relative tab-group flex items-center p-1.5 w-full overflow-x-auto no-scrollbar flex-nowrap shrink-0 bg-white dark:bg-[#161e25] border border-slate-200/80 dark:border-slate-700/80 rounded-2xl ' +
    containerClass
  "
>
  @if (options.length > 0 && activeIndex !== -1) {
    <div
      [class]="
        'absolute top-1.5 bottom-1.5 z-0 pointer-events-none allow-transition ' +
        (isReady() ? 'transition-all duration-300 ease-out opacity-100 ' : 'opacity-0 ') +
        rounded + ' ' +
        (sliderClass ? sliderClass : (
          variant === 'primary' || variant === 'card'
            ? 'bg-slate-100 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700/60 shadow-2xs'
            : 'bg-[var(--dynamic-primary)]/15 dark:bg-[var(--dynamic-primary)]/22 border border-[var(--dynamic-primary)]/35 shadow-2xs'
        ))
      "
      [style.width]="sliderStyle().width"
      [style.left]="sliderStyle().left"
    ></div>
  }

  @for (opt of options; track opt.value; let idx = $index) {
    <button
      #tabBtn
      type="button"
      (click)="onSelect(opt.value)"
      [class.flex-1]="flex"
      [class]="
        'tab-item relative z-10 overflow-hidden py-2.5 px-4 font-bold text-xs sm:text-sm transition-colors duration-300 cursor-pointer flex items-center justify-center gap-2 select-none shrink-0 ' +
        rounded + ' ' +
        (activeValue === opt.value
          ? '!text-[var(--dynamic-primary)] font-bold'
          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-semibold') + ' ' +
        buttonClass
      "
    >
      @if (opt.dotClass) {
        <span [class]="'w-1.5 h-1.5 rounded-full shrink-0 ' + opt.dotClass"></span>
      }

      @if (opt.icon) {
        <app-icon
          [name]="opt.icon"
          class="h-4 w-4 shrink-0 transition-colors duration-300"
          [class]="
            activeValue === opt.value
              ? '!text-[var(--dynamic-primary)]'
              : 'text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300'
          "
        ></app-icon>
      }

      <span [class]="labelClass">{{ opt.label }}</span>

      @if (opt.badge !== undefined && opt.badge !== null && opt.badge !== '') {
        <span
          [class]="
            activeValue === opt.value
              ? 'text-xs font-bold px-1.5 py-0.5 rounded-lg bg-[var(--dynamic-primary)]/10 text-[var(--dynamic-primary)]'
              : 'text-xs font-bold px-1.5 py-0.5 rounded-lg bg-slate-200/60 dark:bg-slate-800 text-slate-500 dark:text-slate-400'
          "
          class="transition-colors duration-300"
        >
          {{ opt.badge }}
        </span>
      }
    </button>
  }
</div>
