@if (totalItems > 0) {
  <div
    class="px-5 py-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-4 flex-wrap"
  >
    <span class="text-xs font-semibold text-slate-400">
      {{
        'pagination.summary'
          | translate
            : {
                start: getStartIndex(),
                end: getEndIndex(),
                total: totalItems,
                item: itemName || ('common.records' | translate),
              }
      }}
    </span>

    @if (totalPages > 1) {
      <div class="flex items-center gap-1.5">
        <button
          type="button"
          (click)="goToPage(currentPage - 1)"
          [disabled]="isButtonDisabled() || currentPage === 1"
          class="w-8.5 h-8.5 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-all active:scale-[0.98]"
        >
          <app-icon name="chevron-left" class="h-4 w-4" strokeWidth="2.5" />
        </button>

        @for (p of pagesArray; track $index) {
          @if (p === '...') {
            <span
              class="w-8.5 h-8.5 flex items-center justify-center text-slate-400 text-xs font-bold"
              >...</span
            >
          } @else {
            <button
              type="button"
              (click)="goToPage(toNumber(p))"
              [disabled]="isButtonDisabled() || currentPage === p"
              [class]="
                currentPage === p
                  ? 'bg-[var(--dynamic-primary)] text-white border-transparent shadow-md shadow-[var(--dynamic-primary)]/25 font-bold cursor-default'
                  : 'bg-white dark:bg-[#1c252e] border-slate-200/80 dark:border-slate-800/80 hover:bg-[var(--dynamic-primary)]/10 text-slate-600 dark:text-slate-300 font-semibold disabled:opacity-50 disabled:cursor-not-allowed'
              "
              class="w-8.5 h-8.5 rounded-xl border text-xs transition-all active:scale-[0.98] flex items-center justify-center"
            >
              {{ p }}
            </button>
          }
        }

        <button
          type="button"
          (click)="goToPage(currentPage + 1)"
          [disabled]="isButtonDisabled() || currentPage === totalPages"
          class="w-8.5 h-8.5 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-all active:scale-[0.98]"
        >
          <app-icon name="chevron-right" class="h-4 w-4" strokeWidth="2.5" />
        </button>
      </div>
    }
  </div>
}
