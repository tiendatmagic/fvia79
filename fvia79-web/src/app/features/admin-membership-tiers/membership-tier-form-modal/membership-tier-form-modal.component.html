<form (ngSubmit)="onSubmit()" class="space-y-4 p-1">
  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
        {{ 'admin.tier_level' | translate }} <span class="text-rose-500">*</span>
      </label>
      <app-custom-input
        [(ngModel)]="level"
        name="level"
        type="number"
        [min]="1"
        required
      />
    </div>

    <div class="space-y-1.5">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
        {{ 'admin.tier_color' | translate }}
      </label>
      <div class="flex items-center gap-2">
        <input
          type="color"
          [(ngModel)]="color"
          name="color"
          class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 cursor-pointer p-0.5 bg-slate-50 dark:bg-slate-900"
        />
        <app-custom-input
          [(ngModel)]="color"
          name="colorText"
          containerClass="w-full"
        />
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
        {{ 'admin.tier_name_vi' | translate }} <span class="text-rose-500">*</span>
      </label>
      <app-custom-input
        [(ngModel)]="nameVi"
        name="nameVi"
        [placeholder]="'admin_tier.tier_name_vi_placeholder' | translate"
        required
      />
    </div>

    <div class="space-y-1.5">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
        {{ 'admin.tier_name_en' | translate }}
      </label>
      <app-custom-input
        [(ngModel)]="nameEn"
        name="nameEn"
        placeholder="e.g. Diamond"
      />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="space-y-1.5">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
        {{ 'admin.tier_min_deposit' | translate }} ($) <span class="text-rose-500">*</span>
      </label>
      <app-custom-input
        [(ngModel)]="minDeposit"
        name="minDeposit"
        type="number"
        [min]="0"
        placeholder="1000"
        required
      />
    </div>

    <div class="space-y-1.5">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
        {{ 'admin.tier_discount_percent' | translate }} (%) <span class="text-rose-500">*</span>
      </label>
      <app-custom-input
        [(ngModel)]="discountPercent"
        name="discountPercent"
        type="number"
        [min]="0"
        [max]="100"
        placeholder="10"
        required
      />
    </div>
  </div>

  <div class="space-y-1.5">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
      {{ 'admin.tier_active_status' | translate }}
    </label>
    <div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/40">
      <app-custom-switch
        [(checked)]="isActive"
      />
      <span class="text-xs font-bold text-slate-700 dark:text-slate-300">
        {{ (isActive ? 'admin.tier_active_desc' : 'admin.tier_inactive_desc') | translate }}
      </span>
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-slate-200/50 dark:border-slate-800/40 mt-6">
    <button
      type="button"
      (click)="onClose()"
      class="px-4.5 py-2.5 rounded-xl border border-slate-200/60 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-900 text-slate-600 dark:text-slate-400 font-extrabold text-sm transition-all cursor-pointer"
    >
      {{ 'action.cancel' | translate }}
    </button>
    <button
      type="submit"
      app-button
      variant="primary"
      [loading]="isSubmitting()"
      class="px-6 py-2.5 rounded-xl font-extrabold text-sm active:scale-[0.98] transition-all cursor-pointer"
    >
      {{ (isEditing ? 'action.save' : 'admin.add_membership_tier') | translate }}
    </button>
  </div>
</form>
