<div class="space-y-6">
  <div class="pb-1">
  <h3 class="text-lg font-black text-slate-800 dark:text-slate-200">{{ 'profile.password_title' | translate }}</h3>
  <p class="text-xs text-slate-400 dark:text-slate-500 font-bold mt-0.5">{{ 'profile.password_desc' | translate }}</p>
  </div>

  <hr class="border-slate-200/40 dark:border-slate-800/40" />

  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="form-field">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5">{{ 'profile.current_password' | translate }} <span class="text-red-500">*</span></label>
      <app-custom-input
        [(ngModel)]="currentPassword"
        name="currentPassword"
        type="password"
      [placeholder]="'profile.current_password_placeholder' | translate"
      />
    </div>

    <div class="form-field">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5">{{ 'profile.new_password' | translate }} <span class="text-red-500">*</span></label>
      <app-custom-input
        [(ngModel)]="newPassword"
        name="newPassword"
        type="password"
      [placeholder]="'profile.min_password' | translate"
      />
    </div>

    <div class="form-field">
    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1.5">{{ 'profile.confirm_new_password' | translate }} <span class="text-red-500">*</span></label>
      <app-custom-input
        [(ngModel)]="newPasswordConfirmation"
        name="newPasswordConfirmation"
        type="password"
      [placeholder]="'profile.confirm_new_password_placeholder' | translate"
      />
    </div>

    <div class="pt-4 flex justify-end">
      <button
        app-button
        [variant]="'primary'"
        [loading]="isSubmitting()"
        type="submit"
        class="w-full sm:w-auto px-6 py-2.5 rounded-xl font-bold bg-[var(--color-primary)] text-white shadow-md shadow-[var(--color-primary)]/10"
      >
    {{ 'profile.update_password' | translate }}
      </button>
    </div>
  </form>
</div>
