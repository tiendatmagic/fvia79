<div class="max-w-[1530px] mx-auto w-full px-4 sm:px-6 py-6 space-y-6">
  <app-page-header
    [title]="'orders.title' | translate"
    [description]="'nav.orders' | translate"
  >
    <ng-container actions>
      <button
        (click)="fetchPage(currentPage())"
        class="px-4 py-2.5 text-sm font-extrabold text-slate-600 dark:text-slate-400 hover:text-primary bg-white dark:bg-slate-950 border border-slate-200/60 dark:border-slate-800/80 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <app-icon name="sync" class="w-4 h-4" />
      {{ 'common.refresh' | translate }}
      </button>
    </ng-container>
  </app-page-header>

  <div
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 bg-slate-50/50 dark:bg-slate-950/20 border border-slate-200/30 dark:border-slate-800/30 rounded-2xl p-4 sm:p-5"
  >
    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        {{ 'orders.date_range' | translate }}
      </label>
      <app-custom-date-time-range
        [(ngModel)]="selectedDateRange"
        (ngModelChange)="fetchPage(1)"
        [showPresets]="true"
        [showTime]="false"
        [placeholder]="'orders.filter_by_date' | translate"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        {{ 'orders.status' | translate }}
      </label>
      <app-custom-select
        [options]="statusOptions"
        valueKey="value"
        labelKey="label"
        [(value)]="selectedStatusFilter"
        (valueChange)="selectedStatusFilter = $event; fetchPage(1)"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">
        {{ 'action.search' | translate }}
      </label>
      <app-custom-search-input
      [placeholder]="'orders.search_placeholder' | translate"
        [(ngModel)]="searchQuery"
        name="searchQuery"
        (valueChange)="onSearch($event)"
        [debounce]="500"
        containerClass="w-full"
      />
    </div>
  </div>

  <div app-card class="overflow-hidden !p-0">
    <app-table
      [columns]="columns()"
      [data]="state.orderStore.orders()"
      [loading]="state.orderStore.loading()"
      emptyText="No orders found."
    >
      <ng-template appTableCell="order_code" let-row="row">
        <div class="flex items-center gap-1.5">
          <button
            (click)="viewDetail(row)"
            [appTooltip]="row.order_code"
            class="font-bold text-[var(--color-primary)] hover:underline underline-offset-2 transition-opacity hover:opacity-80 pb-0.5 border-b border-dashed border-slate-300 dark:border-slate-700"
          >
            #{{ row.order_code | slice: 0 : 8 }}...{{ row.order_code | slice: -4 }}
          </button>
          <button
            (click)="
              copyOrderCode(row.order_code);
              $event.stopPropagation()
            "
            class="w-6 h-6 rounded flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 shrink-0 cursor-pointer"
            [appTooltip]="'orders.copy' | translate"
          >
            <app-icon name="copy" class="w-3.5 h-3.5 shrink-0" />
          </button>
        </div>
      </ng-template>

      <ng-template appTableCell="created_at" let-row="row">
        <span class="text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap" [appTooltip]="row.created_at">
          {{ row.created_at | date: 'dd/MM/yyyy HH:mm' }}
        </span>
      </ng-template>

      <ng-template appTableCell="total_price" let-row="row">
        <span class="font-bold text-emerald-600 dark:text-emerald-400 text-sm" [appTooltip]="row.total_price | appCurrency">
          {{ row.total_price | appCurrency }}
        </span>
      </ng-template>

      <ng-template appTableCell="status" let-row="row">
        <app-badge
          [variant]="
            row.status === 'paid' ? 'success' : row.status === 'pending' ? 'warning' : 'danger'
          "
          size="sm"
          rounded="full"
          [appTooltip]="
            row.status === 'paid'
              ? ('orders.status_completed' | translate)
              : row.status === 'pending'
                ? ('orders.status_pending' | translate)
                : ('orders.status_cancelled' | translate)
          "
        >
          {{
            row.status === 'paid'
              ? ('orders.status_completed' | translate)
              : row.status === 'pending'
                ? ('orders.status_pending' | translate)
                : ('orders.status_cancelled' | translate)
          }}
        </app-badge>
      </ng-template>

      <ng-template appTableCell="actions" let-row="row">
        <div class="flex items-center justify-end gap-2 whitespace-nowrap">
          <button
            (click)="viewDetail(row)"
            class="text-xs font-bold px-3 py-1.5 rounded-lg border border-teal-500/20 dark:border-teal-500/30 hover:bg-teal-100 dark:hover:bg-teal-950/40 text-teal-600 dark:text-teal-400 bg-teal-50 dark:bg-teal-950/20 hover:scale-105 active:scale-95 transition-all cursor-pointer flex items-center gap-1 shrink-0"
            [appTooltip]="'action.details' | translate"
          >
            <app-icon name="eye" class="w-3.5 h-3.5" />
            <span>{{ 'action.details' | translate }}</span>
          </button>
        </div>
      </ng-template>
    </app-table>

    <app-pagination
      [currentPage]="state.orderStore.currentPage()"
      [totalPages]="state.orderStore.lastPage()"
      [totalItems]="state.orderStore.totalOrders()"
      [itemsPerPage]="limit"
      [itemName]="'nav.orders' | translate"
      (pageChange)="fetchPage($event)"
    />
  </div>
</div>
