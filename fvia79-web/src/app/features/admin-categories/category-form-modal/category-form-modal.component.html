<div class="space-y-6 pb-2">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">{{ 'cat.name_en_label' | translate }} <span class="text-red-500">*</span></label>
      <app-custom-input
        placeholder="e.g. Digital Accounts (Default EN)"
        [(ngModel)]="nameEn"
        name="nameEn"
        type="text"
        required
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">{{ 'cat.name_vi_label' | translate }}</label>
      <app-custom-input
        [placeholder]="'cat.name_vi_placeholder' | translate"
        [(ngModel)]="nameVi"
        name="nameVi"
        type="text"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">{{ 'cat.slug' | translate }}</label>
      <app-custom-input
        [placeholder]="'cat.slug' | translate"
        [(ngModel)]="slug"
        name="slug"
        type="text"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">{{ 'cat.sort_order' | translate }}</label>
      <app-custom-input
        placeholder="0"
        [(ngModel)]="sortOrder"
        name="sortOrder"
        type="number"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">{{ 'cat.desc_en' | translate }}</label>
      <app-custom-input
        [placeholder]="'cat.description_en_placeholder' | translate"
        [(ngModel)]="descriptionEn"
        name="descriptionEn"
        type="textarea"
        customClass="min-h-[100px]"
      />
    </div>

    <div class="form-field">
      <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2">{{ 'cat.desc_vi' | translate }}</label>
      <app-custom-input
        [placeholder]="'cat.description_vi_placeholder' | translate"
        [(ngModel)]="descriptionVi"
        name="descriptionVi"
        type="textarea"
        customClass="min-h-[100px]"
      />
    </div>
  </div>

  <div class="pt-1">
    <app-custom-checkbox
      [(ngModel)]="isActive"
      name="isActive"
    >
      <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">
        {{ 'cat.is_active' | translate }}
      </span>
    </app-custom-checkbox>
  </div>

  <div class="pt-4 flex items-center justify-end gap-3 shrink-0">
    <button
      app-button
      (click)="onClose()"
      [variant]="'cancel'"
      class="py-2.5 px-4 rounded-xl text-xs font-bold"
    >
      {{ 'action.cancel' | translate }}
    </button>
    <button
      app-button
      (click)="onSubmit()"
      [loading]="isSubmitting()"
      [variant]="'primary'"
      class="py-2.5 px-4 rounded-xl bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] text-white text-xs font-extrabold active:scale-95 shadow-sm shadow-[var(--color-primary)]/10 cursor-pointer"
    >
      {{ 'action.save' | translate }}
    </button>
  </div>
</div>
