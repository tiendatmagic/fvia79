    <script src="theme-init.js"></script>

    <style>
      :root {
        --splash-bg: #f8fafc;
        --splash-text: #0f172a;
        --splash-brand: #0066FF;
        --splash-primary: #0B193C;
      }
      html.dark {
        --splash-bg: #030712;
        --splash-text: #f8fafc;
      }
      .app-splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        color: var(--splash-text);
        z-index: 99999;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        transition: background-color 0.3s;
      }
      .app-splash-logo-container {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-splash-logo {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 10;
      }
      .app-splash-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(0, 109, 208, 0.1);
        border-radius: 50%;
        border-top-color: var(--splash-brand);
        animation: splash-spin-spinner 0.8s infinite linear;
      }
      @keyframes splash-spin-spinner {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash-screen">
        <div class="app-splash-logo-container">
          <img src="assets/logo-dark.png" class="app-splash-logo dark:hidden" alt="Logo" />
          <img src="assets/logo-light.png" class="app-splash-logo hidden dark:block" alt="Logo" />
        </div>
        <div class="app-splash-spinner"></div>
      </div>
    </app-root>
  </body>
</html>
